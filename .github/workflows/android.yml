name: Application Android

# Builds Epreuves.apk (npm run build, cap sync, Gradle) and, on main, publishes it as the release
# « android », so that https://github.com/JRRocks/Learn-UI-UX/releases/download/android/Epreuves.apk is
# always the last build. Signed with the key of the installed app (secrets ANDROID_KEYSTORE, the .jks in
# base64, and ANDROID_KEYSTORE_PASSWORD): Android installs an update only over an app signed with the
# same key, so without them nothing is built rather than an APK that would not install over it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode = number of commits (android/app/build.gradle)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Clé de signature
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE et ANDROID_KEYSTORE_PASSWORD absents : rien à signer."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/epreuves.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=epreuves\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/epreuves.jks" "$PASSWORD" "$PASSWORD" > android/keystore.properties
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      # chmod: a commit made on Windows does not mark gradlew executable.
      - run: chmod +x gradlew && ./gradlew assembleRelease
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk Epreuves.apk
      - name: Publier Epreuves.apk
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The versionName that Gradle gave the APK (1.0.<commits>). The app reads it in the title of the
          # release and offers the update when it is newer than its own (src/lib/appUpdate.ts).
          VERSION=$(jq -r '.elements[0].versionName' android/app/build/outputs/apk/release/output-metadata.json)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version de l’APK illisible : « $VERSION »."
            exit 1
          fi
          gh release delete android --cleanup-tag --yes || true
          # Not « latest »: that one stays the Windows .exe (README, releases/latest/download/Epreuves.exe).
          gh release create android Epreuves.apk --target "$GITHUB_SHA" --latest=false \
            --title "Épreuves pour Android $VERSION" \
            --notes "Ouvrez ce lien depuis le téléphone, téléchargez Epreuves.apk et installez-le. Une nouvelle version s’installe par-dessus l’ancienne et garde la progression. Une fois installée, l’app cherche elle-même les versions suivantes ici et propose de les installer. Version $VERSION, construite depuis ${GITHUB_SHA::7}."
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: Epreuves-android
          path: Epreuves.apk
