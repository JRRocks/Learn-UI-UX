<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Atelier pour progresser en UI/UX : leçons, épreuves visuelles, critique, anti-patterns et règles d'interface selon les cultures." />
    <meta name="theme-color" content="#f7f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161a24" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Épreuves — atelier UI/UX</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('learn-ui-ux:v1') || 'null');
        var t = s && s.settings && s.settings.theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
